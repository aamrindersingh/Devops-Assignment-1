# Mini project: one small two tier app with three faults planted in it.
# Nothing in this file says which lines are wrong. The job is to find them
# from the cluster, not by reading the YAML.
#
# Fault 1: the api Deployment mounts a Secret key that does not exist
# Fault 2: the web Service targets the wrong port
# Fault 3: the api container asks for more memory than its limit allows
apiVersion: v1
kind: Secret
metadata:
  name: api-credentials
type: Opaque
stringData:
  username: apiuser
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          env:
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: password
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 9090
