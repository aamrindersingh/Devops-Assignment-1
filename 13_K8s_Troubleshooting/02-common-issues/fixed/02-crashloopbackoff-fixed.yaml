# Fix: the container no longer exits. In a real app this is where the
# missing config would be supplied rather than the command changed.
apiVersion: v1
kind: Pod
metadata:
  name: broken-crashloop
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting up'; echo 'config loaded'; sleep 3600"]
