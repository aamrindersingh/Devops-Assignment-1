# Broken on purpose: the Service selector says app=web-frontend but the
# Deployment labels its pods app=webfrontend (no hyphen). Nothing matches,
# so the Service has no endpoints and every request is refused.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webfrontend
  template:
    metadata:
      labels:
        app: webfrontend
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
spec:
  selector:
    app: web-frontend
  ports:
    - port: 80
      targetPort: 80
