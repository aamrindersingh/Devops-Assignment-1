# Dynamic provisioning: no PersistentVolume is written by hand. The PVC names
# a StorageClass (kind ships "standard" backed by local-path), and its
# provisioner creates the PV automatically when the claim is made.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-pv-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'written to a dynamically provisioned volume' > /data/hello.txt; sleep 3600"]
      volumeMounts:
        - name: store
          mountPath: /data
  volumes:
    - name: store
      persistentVolumeClaim:
        claimName: dynamic-pvc
