# A statically provisioned PersistentVolume: the cluster admin creates the
# storage up front, and a PVC then claims it. Compare with the PVC in
# dynamic-pvc.yaml, where no PV is written by hand at all.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: manual-pv
spec:
  capacity:
    storage: 200Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  # "" means: do not let the default StorageClass dynamically provision this,
  # bind it to the matching claim below instead.
  storageClassName: manual
  hostPath:
    path: /mnt/manual-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manual-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: manual-pv-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'data on a static PV' > /data/file.txt; sleep 3600"]
      volumeMounts:
        - name: store
          mountPath: /data
  volumes:
    - name: store
      persistentVolumeClaim:
        claimName: manual-pvc
