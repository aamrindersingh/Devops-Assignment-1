# hostPath: mounts a path from the NODE's filesystem into the Pod.
# Tied to one node, so a Pod rescheduled elsewhere sees different data.
# Used here only to read the node's own hostname file.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  labels:
    demo: volumes
spec:
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: node-etc
          mountPath: /node-etc
          readOnly: true
  volumes:
    - name: node-etc
      hostPath:
        path: /etc
        type: Directory
