# Hammers the service in a tight loop. Runs as its own pod so the load
# is not counted against the deployment the HPA is watching.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -q -O- http://php-apache; done"]
