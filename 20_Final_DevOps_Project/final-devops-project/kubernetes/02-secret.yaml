# Committed with placeholder values only. The real Secret is created from
# the command line and never enters git:
#
#   kubectl -n clip create secret generic clip-secrets \
#     --from-literal=PGUSER=clip \
#     --from-literal=PGPASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=ADMIN_TOKEN="$(openssl rand -hex 16)"
#
# This file exists so the required keys are documented and so a reviewer
# can see the shape without seeing the values. Committing a real Secret
# would be pointless anyway, since base64 is encoding and not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: clip-secrets
  namespace: clip
type: Opaque
stringData:
  PGUSER: "REPLACE_ME"
  PGPASSWORD: "REPLACE_ME"
  ADMIN_TOKEN: "REPLACE_ME"
