# Fault: the Service forwards to a port the container does not listen on.
# Endpoints are populated, so everything looks healthy, and every request
# through the Ingress fails.
apiVersion: v1
kind: Service
metadata:
  name: clip-clip
  namespace: clip
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clip
    app.kubernetes.io/instance: clip
    component: web
  ports:
    - name: http
      port: 80
      targetPort: 8080     # the app listens on 3000
