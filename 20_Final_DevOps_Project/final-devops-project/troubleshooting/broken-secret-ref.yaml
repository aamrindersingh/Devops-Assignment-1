# Fault: the Deployment reads a Secret key that does not exist.
# PGPASSWORD was renamed to DB_PASSWORD somewhere, and nothing else
# was updated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clip-broken-secret
  namespace: clip
spec:
  replicas: 1
  selector:
    matchLabels: { app: clip-broken-secret }
  template:
    metadata:
      labels: { app: clip-broken-secret }
    spec:
      containers:
        - name: clip
          image: ghcr.io/aamrindersingh/devops-assignment-1/clip:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: clip-secrets
                  key: DB_PASSWORD     # the key is actually PGPASSWORD
