apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clip.fullname" . }}-config
  labels:
    {{- include "clip.labels" . | nindent 4 }}
data:
  BASE_URL:    {{ .Values.config.baseUrl | quote }}
  CODE_LENGTH: {{ .Values.config.codeLength | quote }}
  PG_POOL_MAX: {{ .Values.config.pgPoolMax | quote }}
  PGDATABASE:  {{ .Values.config.pgDatabase | quote }}
  PGHOST:      {{ include "clip.postgresName" . | quote }}
  PGPORT:      "5432"
