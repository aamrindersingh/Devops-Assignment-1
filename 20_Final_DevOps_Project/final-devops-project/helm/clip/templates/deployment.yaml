apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clip.fullname" . }}
  labels:
    {{- include "clip.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Only pin replicas when the HPA is off, otherwise every helm upgrade
  # fights the autoscaler over the same field.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "clip.selectorLabels" . | nindent 6 }}
      component: web
  template:
    metadata:
      labels:
        {{- include "clip.selectorLabels" . | nindent 8 }}
        component: web
      annotations:
        # Rolls the pods when the config changes, otherwise the ConfigMap
        # updates and the running pods keep the old environment.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clip
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: {{ include "clip.fullname" . }}-config }
            - secretRef:    { name: {{ .Values.secret.existingSecret }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
