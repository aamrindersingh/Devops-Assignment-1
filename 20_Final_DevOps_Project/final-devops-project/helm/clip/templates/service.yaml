apiVersion: v1
kind: Service
metadata:
  name: {{ include "clip.fullname" . }}
  labels:
    {{- include "clip.labels" . | nindent 4 }}
    component: web
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "clip.selectorLabels" . | nindent 4 }}
    component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
