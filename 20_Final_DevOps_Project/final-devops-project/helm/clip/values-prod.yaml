# Production overlay. Only the differences.
replicaCount: 3

config:
  baseUrl: "https://clip.example.ac.in"

autoscaling:
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 50

postgres:
  storage: 10Gi
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2000m, memory: 2Gi }

monitoring:
  serviceMonitor: true
  prometheusRule: true

backup:
  enabled: true
