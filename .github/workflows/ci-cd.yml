name: CI/CD Demo

# CI runs on every push and pull request touching the app.
# CD (the image push) only runs on main, so a PR cannot publish an image.
on:
  push:
    branches: [main]
    paths:
      - '15_CICD_GitHub_Actions/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - '15_CICD_GitHub_Actions/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cicd-demo
  APP_DIR: 15_CICD_GitHub_Actions/app

jobs:
  # ---------- CI ----------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 15_CICD_GitHub_Actions/app
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Write a build report
        run: |
          mkdir -p reports
          {
            echo "commit:  ${{ github.sha }}"
            echo "ref:     ${{ github.ref }}"
            echo "run:     ${{ github.run_number }}"
            echo "node:    $(node --version)"
            echo "tests:   passed"
          } > reports/build-info.txt
          cat reports/build-info.txt

      # Artifacts are how one job hands files to a human or a later job.
      - name: Upload the build report as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: 15_CICD_GitHub_Actions/app/reports/build-info.txt
          retention-days: 7

  # ---------- CD ----------
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: build-and-test          # will not start unless CI passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write              # needed to push to GHCR
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is injected by Actions, so no secret to manage
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        run: |
          REPO_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "tags=${{ env.REGISTRY }}/${REPO_LC}:${{ github.sha }},${{ env.REGISTRY }}/${REPO_LC}:latest" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Summarise the run
        run: |
          {
            echo "### Image published"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| image | \`${{ steps.meta.outputs.image }}\` |"
            echo "| tag | \`${{ github.sha }}\` |"
            echo "| run | ${{ github.run_number }} |"
          } >> "$GITHUB_STEP_SUMMARY"
