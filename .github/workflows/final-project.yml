name: Final Project (clip)

on:
  push:
    branches: [main]
    paths:
      - '20_Final_DevOps_Project/**'
      - '.github/workflows/final-project.yml'
  pull_request:
    branches: [main]
    paths:
      - '20_Final_DevOps_Project/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/aamrindersingh/devops-assignment-1/clip
  PROJECT: 20_Final_DevOps_Project/final-devops-project

# Code -> Build -> Test -> SAST -> SCA -> Secrets -> Image -> Image scan
#      -> Gate -> Push -> Chart validation
jobs:

  build-test:
    name: 1. Build and unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 20_Final_DevOps_Project/final-devops-project/application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  sast:
    name: 2. SAST (Semgrep)
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - name: Scan application source
        working-directory: 20_Final_DevOps_Project/final-devops-project
        # The redirect handler is a known and accepted finding, justified in
        # security/README.md and suppressed inline with a nosemgrep comment
        # that names the rule. Everything else must come back clean.
        # Community rulesets plus the custom rules in security/semgrep-rules,
        # which exist because the community ones return nothing on this code.
        run: semgrep scan --config=p/javascript --config=p/security-audit --config=security/semgrep-rules --error --json-output=semgrep.json application/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: 20_Final_DevOps_Project/final-devops-project/semgrep.json
          retention-days: 7

  sca:
    name: 3. SCA (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: 20_Final_DevOps_Project/final-devops-project/application
      - name: npm audit
        continue-on-error: true
        working-directory: 20_Final_DevOps_Project/final-devops-project/application
        run: npm audit --audit-level=high
      - name: Trivy dependency scan (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: 20_Final_DevOps_Project/final-devops-project/application
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secret-scan:
    name: 4. Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: 20_Final_DevOps_Project/final-devops-project/security/.gitleaks.toml

  image-scan:
    name: 5. Build image and scan it
    runs-on: ubuntu-latest
    needs: [build-test]
    outputs:
      critical: ${{ steps.count.outputs.critical }}
      high: ${{ steps.count.outputs.high }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (not pushed yet)
        run: docker build -t scan:${{ github.sha }} -f ${{ env.PROJECT }}/docker/Dockerfile ${{ env.PROJECT }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:${{ github.sha }}
          format: json
          output: image.json
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Count findings
        id: count
        run: |
          C=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' image.json)
          H=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")]     | length' image.json)
          echo "critical=$C" >> "$GITHUB_OUTPUT"
          echo "high=$H"     >> "$GITHUB_OUTPUT"
          echo "CRITICAL=$C HIGH=$H"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: image-scan-report, path: image.json, retention-days: 7 }

  helm-validate:
    name: 6. Validate chart and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: 'v3.16.2' }
      - name: helm lint, both value sets
        run: |
          helm lint ${{ env.PROJECT }}/helm/clip
          helm lint ${{ env.PROJECT }}/helm/clip -f ${{ env.PROJECT }}/helm/clip/values-prod.yaml
      - name: Render and validate offline with kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # kubeconform carries the schemas, so this needs no cluster.
          # -ignore-missing-schemas skips the Prometheus Operator CRDs.
          helm template clip ${{ env.PROJECT }}/helm/clip -f ${{ env.PROJECT }}/helm/clip/values-prod.yaml \
            | ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 ${{ env.PROJECT }}/kubernetes/

  security-gate:
    name: 7. Security gate
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan, image-scan, helm-validate]
    if: always()
    steps:
      - name: Decide
        run: |
          FAILED=0
          for r in "${{ needs.sast.result }}" "${{ needs.sca.result }}" \
                   "${{ needs.secret-scan.result }}" "${{ needs.image-scan.result }}" \
                   "${{ needs.helm-validate.result }}"; do
            [ "$r" != "success" ] && FAILED=1
          done
          {
            echo "### Security gate"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| SAST (Semgrep) | ${{ needs.sast.result }} |"
            echo "| SCA (Trivy) | ${{ needs.sca.result }} |"
            echo "| Secret scan (Gitleaks) | ${{ needs.secret-scan.result }} |"
            echo "| Image scan (Trivy) | ${{ needs.image-scan.result }} |"
            echo "| Chart and manifests | ${{ needs.helm-validate.result }} |"
            echo "| Image CRITICAL | ${{ needs.image-scan.outputs.critical }} |"
            echo "| Image HIGH | ${{ needs.image-scan.outputs.high }} |"
            echo ""
            echo "Image findings come from the node:20-alpine base and are reported,"
            echo "not gated. Fixing them needs a base image bump rather than an"
            echo "application change. The blocking checks are the five above."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" = "1" ]; then echo "gate closed"; exit 1; fi
          echo "gate open"

  publish:
    name: 8. Push image
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT }}
          file: ${{ env.PROJECT }}/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
      - name: Note for the GitOps step
        run: |
          {
            echo "### Image published"
            echo ""
            echo "\`${{ env.IMAGE }}:${{ github.sha }}\`"
            echo ""
            echo "Argo CD reconciles the cluster from this repository, so no"
            echo "step here touches the cluster. A hosted runner cannot reach"
            echo "a kind cluster on a laptop, and pretending otherwise would"
            echo "be a deploy step that never deploys."
          } >> "$GITHUB_STEP_SUMMARY"
